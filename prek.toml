#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-toml" },
  { id = "check-added-large-files" },
  { id = "check-merge-conflict" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    language = "system",
    entry = "cargo fmt -- --check",
    files = "\\.rs$",
    pass_filenames = false,
  },
  {
    id = "cargo-clippy",
    name = "cargo clippy",
    language = "system",
    entry = "cargo clippy --all-targets -- -D warnings",
    files = "\\.rs$",
    pass_filenames = false,
  },
  {
    id = "cargo-test",
    name = "cargo test",
    language = "system",
    entry = "cargo test",
    files = "\\.rs$",
    pass_filenames = false,
  },
]
